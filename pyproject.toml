[project]
name = "support-triage-bot"
version = "0.1.0"
description = "Customer support bot: triage first, then cited answers from help docs, scoped account tools, or a human"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["support*"]

[tool.setuptools.package-data]
support = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
